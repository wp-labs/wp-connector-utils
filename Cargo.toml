[package]
name = "wp-connector-utils"
version = "0.3.4" #@gxl:set(version)
edition = "2024"
description = "Shared utilities for WP connector implementations — Arrow IPC encode/decode, WireFormat, NDJSON conversion, and batch metadata processing"
authors = ["WarpParse Dev Team"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wp-labs/wp-connector-utils"
homepage = "https://github.com/wp-labs/wp-connector-utils"
documentation = "https://docs.rs/wp-connector-utils"
keywords = ["arrow", "ipc", "connector", "warpparse", "ndjson"]
categories = ["asynchronous", "encoding", "parsing"]

[dependencies]
wp-connector-api = "0.13"
wp-model-core = "0.10"
# 线协议契约表的实现处（A-2 第 2 步：本 crate 的 `arrow::wp_type_to_arrow` 已改为再导出它）
#
# 必须写**最低可用版本** 0.4.1：`contract` 模块是 0.4.1 才有的。若写 `"0.4"`，
# 消费方 lock 停在 0.4.0 时会解析到缺该模块的版本 → 编译失败（`unresolved import
# wp_arrow::contract`）。0.3.3 就是这个写法的事故版。
wp-arrow = "0.4.1"
arrow = { version = "60", default-features = false, features = ["ipc"] }
orion-error = "0.8"
serde_json = "1.0"
chrono = "0.4"
