[package]
name = "wp-connector-utils"
version = "0.1.0"
edition = "2024"
description = "Shared utilities for WP connector implementations — batch metadata processing, format helpers"
authors = ["WarpParse Dev Team"]
license = "Apache-2.0"

[dependencies]
wp-connector-api = "0.11"
wp-model-core = "0.8"
arrow = { version = "59", default-features = false, features = ["ipc"] }
orion-error = "0.8"
serde_json = "1.0"
chrono = "0.4"

[patch.crates-io]
wp-connector-api = { path = "../wp-connector-api" }
